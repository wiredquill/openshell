name: Build and Push Hermes OpenShell Images

# The sandbox image (SUSE BCI and openSUSE Leap bases) and the client image the
# hermes-openshell chart deploys, the openSUSE Leap lab image that is the
# openshell-gateway chart's default sandbox (openshell-lab/leap, also tagged
# 16.0 on main), then hermes-rancher (the BCI sandbox image of
# the same commit plus Rancher's agent CLI) for the hermes-rancher chart. Every
# push is tagged with its commit sha, so a branch can be deployed for testing;
# only main also moves `latest`.
on:
  push:
    paths:
      - 'images/hermes/**'
      - 'images/hermes-client/**'
      - 'images/hermes-rancher/**'
      - 'labs/docker/images/leap/**'
      - '.github/workflows/build-hermes-openshell.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # hermes Dockerfiles copy their scripts from images/, so build from the root
          - image: hermes-openshell
            context: .
            file: images/hermes/Dockerfile
            build-args: ""
          - image: hermes-openshell-opensuse
            context: .
            file: images/hermes/Dockerfile
            build-args: BASE=registry.opensuse.org/opensuse/leap:16.0
          - image: hermes-openshell-client
            context: .
            file: images/hermes-client/Dockerfile
            build-args: ""
          # openshell-gateway's default sandbox image (charts/openshell-gateway
          # values: openshell-lab/leap:16.0); COPYs probes/ from its own dir
          - image: openshell-lab/leap
            context: labs/docker/images/leap
            file: labs/docker/images/leap/Dockerfile
            build-args: ""
            version-tag: "16.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ matrix.version-tag }},enable=${{ matrix.version-tag != '' && github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Rancher's CLI ships for linux/amd64 only, so this image is amd64 only.
  rancher:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hermes-rancher
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Short sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push hermes-rancher
        uses: docker/build-push-action@v5
        with:
          context: .
          file: images/hermes-rancher/Dockerfile
          build-args: HERMES_IMAGE=ghcr.io/${{ github.repository_owner }}/hermes-openshell:${{ steps.sha.outputs.short }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
