{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.enabled needs ingress.host (e.g. hermes.<cluster>.dna-42.com)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hermes-openshell.fullname" . }}
  labels:
    {{- include "hermes-openshell.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # ttyd serves the page and its websocket (/ws) on the same port;
          # Traefik and ingress-nginx pass the websocket upgrade through.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hermes-openshell.fullname" . }}
                port:
                  name: http
{{- end }}
