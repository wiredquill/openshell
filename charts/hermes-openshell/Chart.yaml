apiVersion: v2
name: hermes-openshell
description: 'Hermes Agent (Nous Research) in an NVIDIA OpenShell sandbox on a SUSE OS, with a choice of four security profiles and a browser terminal. Install next to the OpenShell gateway app; also a component of the hermes-openshell SUSE AI Factory blueprints.'
type: application
version: 0.2.2
appVersion: 0.19.0
keywords:
- ai
- agent
- hermes
- openshell
- sandbox
- suse-ai-factory
maintainers:
- name: WiredQuill
  url: https://github.com/wiredquill
home: https://github.com/wiredquill/openshell
sources:
- https://github.com/NousResearch/hermes-agent
- https://github.com/NVIDIA/OpenShell
dependencies:
  # Optional: install the OpenShell gateway in this release's namespace too
  # (openshellGateway.enabled). Vendored as charts/openshell-gateway-*.tgz
  # because scripts/publish-charts.sh runs plain `helm package`; after bumping
  # charts/openshell-gateway, run `helm dependency build charts/hermes-openshell`.
  - name: openshell-gateway
    alias: openshellGateway
    version: 0.1.9
    repository: file://../openshell-gateway
    condition: openshellGateway.enabled
annotations:
  catalog.cattle.io/display-name: OpenShell 3 - Hermes Agent sandbox
  catalog.cattle.io/release-name: hermes
