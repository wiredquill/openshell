# Lab 03: process identity.
# Static section. The workload always runs with zero capabilities,
# no_new_privs, and a seccomp filter; policy only picks the non-root UID/GID.
# Root ("0") is rejected by the schema.
version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /bin, /etc, /proc, /dev/urandom]
  read_write: [/tmp, /dev/null]

landlock:
  compatibility: hard_requirement

process:
  # A UID with no passwd entry in the image: the workload runs as "nobody
  # in particular", overriding the image's USER sandbox (1000).
  run_as_user: "2000"
  run_as_group: "2000"
