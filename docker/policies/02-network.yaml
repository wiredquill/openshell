# Lab 02: network access.
# network_policies is a live section: edit and `openshell policy set` it on a
# running sandbox without a restart. Each rule = (binaries) x (endpoints).
version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /bin, /etc, /proc, /dev/urandom]
  read_write: [/tmp, /dev/null]

landlock:
  compatibility: hard_requirement

network_policies:
  # L7 inspected, read-only: GET/HEAD/OPTIONS pass, POST is answered 403.
  github_readonly:
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl

  # Same shape for the openSUSE mirror, but only for curl, not python.
  opensuse_mirror:
    endpoints:
      - host: download.opensuse.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl

  # Private LAN model server. Private addresses are blocked by default (SSRF
  # protection); allowed_ips pins the endpoint to exactly this address.
  # Explicit rules instead of a preset: list models and chat, nothing else.
  qwen_local:
    endpoints:
      - host: 10.9.0.42
        port: 30400
        allowed_ips: [10.9.0.42/32]
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: /v1/models }
          - allow: { method: POST, path: /v1/chat/completions }
    binaries:
      - path: /usr/bin/curl
      - path: /usr/bin/python3.13
