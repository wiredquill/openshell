# One blueprint per Rancher app in the wiredquill-openshell repository, the same
# chart and version, with the chart's own defaults: install them in the numbered
# order, like the Rancher apps.
apiVersion: ai-factory.suse.com/v1alpha1
kind: Blueprint
metadata:
  labels:
    ai-factory.suse.com/blueprint-name: hermes-openshell
    ai-factory.suse.com/blueprint-version: 2.2.0
  name: hermes-openshell-2-2-0
spec:
  source: Custom  # community, unsupported demo
  displayName: OpenShell 3 - Hermes Agent sandbox
  version: 2.2.0
  description: |
    Nous Research's Hermes Agent in an NVIDIA OpenShell sandbox on SUSE BCI 16 or
    openSUSE Leap 16, under one of four security profiles (lockdown, research,
    developer, dangerous), with a browser terminal. Pick the model backend in the
    form: an OpenAI-compatible API such as OpenRouter (the gateway holds the key,
    so it never enters the sandbox) or a vLLM service in the cluster.

    Install into the namespace of OpenShell 2 - Gateway. To install the gateway
    together with Hermes, use the OpenShell 2+3 - Hermes Agent sandbox with gateway
    blueprint. Agent Sandbox (OpenShell 1) is needed either way.

    Install-form caveat (aif-ui 2.4.0): changes made in the form view of the
    Customize step, including "Install the OpenShell gateway in this namespace",
    are not sent. Set options in the form, then switch to the YAML tab and make any
    edit there (a trailing space is enough); the Review step must list the
    component as customized, otherwise the chart defaults are installed.


    2.2.0 adds the "custom" profile and Policy add-ons: pick a profile (lockdown,
    research, developer, dangerous or custom), then tick add-ons for web reads,
    SUSE docs, GitHub read or push, PyPI and Hugging Face, list extra hosts, or
    paste extra network rules. They are added to the profile's policy before the
    sandbox is created. Because the form view's answers are not sent (see the
    caveat), set them in the YAML tab, e.g.
      profile: custom
      policy:
        addons: {githubRead: true, pypi: true}
        extraHosts: "api.example.com:8443 read-write"
    Also adds model.contextLength and model.maxTokens, which keep Hermes's
    requests inside a vLLM server's --max-model-len (set both for vLLM: Hermes
    otherwise asks for 65536 output tokens).

    2.1.0 adds that gateway option and an optional HTTPS Ingress for the browser
    terminal (Browser terminal > HTTPS Ingress) using the cluster's wildcard
    certificate.
    2.0.0 installs only this app, like the Rancher app. 1.x bundled Agent Sandbox
    and the gateway.
  components:
  - chartName: hermes-openshell
    chartRepo: wiredquill-openshell
    chartVersion: 0.3.0
    releaseName: hermes
