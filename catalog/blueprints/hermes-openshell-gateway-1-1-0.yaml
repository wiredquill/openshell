# Hermes Agent sandbox with its own OpenShell gateway: the hermes-openshell chart
# with openshellGateway.enabled set here, in the blueprint, rather than in the
# install form. The AI Factory wizard (aif-ui 2.4.0) drops answers given in the
# form view, so a form checkbox alone can't be relied on to install the gateway.
apiVersion: ai-factory.suse.com/v1alpha1
kind: Blueprint
metadata:
  labels:
    ai-factory.suse.com/blueprint-name: hermes-openshell-gateway
    ai-factory.suse.com/blueprint-version: 1.1.0
  name: hermes-openshell-gateway-1-1-0
spec:
  source: Custom  # community, unsupported demo
  displayName: OpenShell 2+3 - Hermes Agent sandbox with gateway
  version: 1.1.0
  description: |
    OpenShell 3 - Hermes Agent sandbox together with its own OpenShell 2 - Gateway,
    in one namespace and one Helm release. Use it for a namespace that has no
    gateway yet; for a namespace that already has one, use OpenShell 3 - Hermes
    Agent sandbox instead (two gateways in one namespace collide on the openshell
    Service and Secrets).

    Agent Sandbox (OpenShell 1) must already be installed in the cluster.
    Prerequisites: a CNI that enforces NetworkPolicy and a default StorageClass for
    the gateway database.

    Install-form caveat (aif-ui 2.4.0): changes made in the form view of the
    Customize step are not sent. Set options in the form, then switch to the YAML
    tab and make any edit there (a trailing space is enough); the Review step must
    list the component as customized, otherwise the chart defaults are installed.

    1.1.0 adds the "custom" profile and Policy add-ons: pick a profile (lockdown,
    research, developer, dangerous or custom), then tick add-ons for web reads,
    SUSE docs, GitHub read or push, PyPI and Hugging Face, list extra hosts, or
    paste extra network rules. They are added to the profile's policy before the
    sandbox is created. Because the form view's answers are not sent (see the
    caveat), set them in the YAML tab, e.g.
      profile: custom
      policy:
        addons: {githubRead: true, pypi: true}
        extraHosts: "api.example.com:8443 read-write"
    Also adds model.contextLength and model.maxTokens, which keep Hermes's
    requests inside a vLLM server's --max-model-len (set both for vLLM: Hermes
    otherwise asks for 65536 output tokens).

  components:
  - chartName: hermes-openshell
    chartRepo: wiredquill-openshell
    chartVersion: 0.3.0
    releaseName: hermes
    values:
      openshellGateway:
        enabled: true
