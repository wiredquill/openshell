# One blueprint per Rancher app in the wiredquill-openshell repository, the same
# chart and version, with the chart's own defaults: install them in the numbered
# order, like the Rancher apps.
apiVersion: ai-factory.suse.com/v1alpha1
kind: Blueprint
metadata:
  labels:
    ai-factory.suse.com/blueprint-name: hermes-rancher
    ai-factory.suse.com/blueprint-version: 2.0.0
  name: hermes-rancher-2-0-0
spec:
  source: Custom  # community, unsupported demo
  displayName: Hermes for Rancher
  version: 2.0.0
  description: |
    Nous Research's Hermes Agent for platform engineers: an NVIDIA OpenShell
    sandbox on SUSE BCI 16 (amd64) with kubectl on the cluster it runs on, as a
    ServiceAccount of its own (view or operator access), and Rancher's agent CLI
    with its skill. Only kubectl and helm may reach the API server. Anyone who can
    open the terminal gets the agent's cluster access.

    Install into the namespace of OpenShell 2 - Gateway.

    2.0.0 installs only this app, like the Rancher app. 1.x bundled Agent Sandbox
    and the gateway.
  components:
  - chartName: hermes-rancher
    chartRepo: wiredquill-openshell
    chartVersion: 0.2.2
    releaseName: hermes-rancher
