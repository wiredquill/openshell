# OpenShell gateway config for the Docker lab (installed to ~/.config/openshell/gateway.toml).
# The RPM seeds a Podman-pinned config; this pins the Docker driver instead.

[openshell]
version = 2

[openshell.gateway]
# Built-in default listener 127.0.0.1:17670. Host-networked Docker supervisors
# reach the gateway over this loopback address.
compute_driver = "docker"

[openshell.drivers.docker]
socket_path = "/var/run/docker.sock"
# openSUSE workload image used when `sandbox create` has no --from.
default_image = "localhost/openshell-lab/leap:16.0"
# Lab images are built locally and never pushed, so never pull them.
image_pull_policy = "if_not_present"
sandbox_label = "openshell-lab"
supervisor_network_mode = "host"
